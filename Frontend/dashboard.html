<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAR Robot Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1b1f24;
  --surface:#252930;
  --surface2:#2d3240;
  --border:#3d4550;
  --accent:#4d87c7;
  --green:#4da55e;
  --yellow:#c9a32e;
  --red:#b84444;
  --text:#c4cad6;
  --muted:#7a8496;
}
body{
  background:var(--bg);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--text);
  height:100vh;overflow:hidden;display:flex;flex-direction:column
}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

#topbar{
  height:42px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0
}
#topbar h1{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  color:var(--accent);letter-spacing:2px;text-transform:uppercase;white-space:nowrap
}
.top-sep{flex:1}
#connection-status{
  font-size:10px;font-weight:600;padding:2px 8px;
  border-radius:3px;border:1px solid var(--border);letter-spacing:1px;
  transition:.3s
}
#connection-status.live{color:var(--green);border-color:var(--green)}
#connection-status.offline{color:var(--red);border-color:var(--red)}
#agent-select{
  background:var(--surface2);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;
  padding:3px 7px;cursor:pointer
}
.top-btn{
  font-size:11px;padding:4px 10px;border-radius:3px;border:1px solid var(--border);
  background:linear-gradient(to bottom,#353c48,#2c3340);
  color:var(--text);cursor:pointer;text-decoration:none;transition:.15s
}
.top-btn:hover{background:linear-gradient(to bottom,#3f4858,#353c4a)}
#topbar-score{
  font-family:'Share Tech Mono',monospace;font-size:13px;font-weight:700;
  color:var(--accent);white-space:nowrap
}

#main-grid{
  flex:1;display:grid;
  grid-template-columns:1fr 350px;
  grid-template-rows:1fr 158px;
  gap:6px;padding:6px;min-height:0
}

.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  display:flex;flex-direction:column;overflow:hidden
}

.panel-header{
  padding:6px 11px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  background:var(--surface2)
}
.panel-title{
  font-size:10px;font-weight:600;
  letter-spacing:0.5px;text-transform:uppercase;color:var(--accent)
}
.panel-tag{
  font-size:9px;padding:2px 6px;border-radius:3px;border:1px solid;
  text-transform:uppercase;letter-spacing:0.5px
}
.tag-cam{border-color:var(--accent);color:var(--accent)}
.tag-lidar{border-color:var(--green);color:var(--green)}

/* ── 3D CAM ── */
#cam-panel{grid-column:1;grid-row:1;position:relative}
#three-wrap{flex:1;position:relative;overflow:hidden;display:block}
#three-canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#cam-hud{position:absolute;top:0;left:0;pointer-events:none}
#compass-canvas{position:absolute;bottom:10px;right:10px;opacity:.85;pointer-events:none}
#hdg-bar{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--accent);
  background:rgba(0,0,0,.65);padding:3px 12px;border-radius:3px;
  border:1px solid var(--border);letter-spacing:1px;pointer-events:none;white-space:nowrap
}
#corner-ind{
  display:none;position:absolute;top:36px;left:50%;transform:translateX(-50%);
  padding:3px 14px;border-radius:3px;background:rgba(201,163,46,.18);
  border:1px solid var(--yellow);color:var(--yellow);
  font-size:10px;font-weight:600;letter-spacing:1px;animation:blink .8s infinite;pointer-events:none
}
#yolo-stamp{position:absolute;bottom:8px;left:10px;font-size:8px;color:rgba(77,135,199,.35);pointer-events:none}

/* ── LIDAR ── */
#lidar-panel{grid-column:2;grid-row:1}
#lidar-canvas{flex:1;display:block;width:100%}

/* ── TELEMETRY STRIP ── */
#tele-panel{grid-column:1/-1;grid-row:2;flex-direction:row;gap:0}
.tele-col{flex:1;padding:7px 11px;border-right:1px solid var(--border);overflow-y:auto}
.tele-col:last-child{border-right:none}
.tele-title{
  font-size:9px;font-weight:600;letter-spacing:0.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px
}
.tele-row{
  display:flex;justify-content:space-between;font-size:11px;
  padding:2px 0;border-bottom:1px solid rgba(61,69,80,.3)
}
.tele-row:last-child{border-bottom:none}
.tele-label{color:var(--muted)}
.tele-val{color:var(--text);font-weight:600;font-family:'Share Tech Mono',monospace}
.tele-val.green{color:var(--green)}.tele-val.red{color:var(--red)}.tele-val.yellow{color:var(--yellow)}

.d-entry{
  font-size:10px;padding:2px 6px;border-radius:2px;margin-bottom:2px;
  display:flex;justify-content:space-between;align-items:center
}
.d-entry.aggr{background:rgba(184,68,68,.12);color:var(--red)}
.d-entry.patr{background:rgba(201,163,46,.12);color:var(--yellow)}
.d-entry.tgt{background:rgba(200,170,50,.12);color:#c9a83c}
.d-entry.none{color:var(--muted);font-style:italic}
.d-badge{font-size:8px;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.08)}

#dec-log{font-size:10px;line-height:1.7;color:var(--muted);font-family:'Share Tech Mono',monospace}
#dec-log .da{color:var(--accent)}
#dec-log .de{color:var(--red)}
#dec-log .dc{color:var(--yellow)}
#dec-log .dg{color:var(--green)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div id="topbar">
  <h1>SAR // Robot Dashboard</h1>
  <span id="connection-status" class="offline">OFFLINE</span>
  <label for="agent-select" style="font-size:11px;color:var(--muted)">AGENT:</label>
  <select id="agent-select" onchange="selectAgent(this.value)">
    <option value="0">Agent 0</option>
  </select>
  <div class="top-sep"></div>
  <span id="topbar-score">SCORE: 0</span>
  <span id="topbar-dec" style="font-size:10px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">-</span>
  <div class="top-sep"></div>
  <a class="top-btn" href="mission.html" target="_blank">↗ Map View</a>
  <a class="top-btn" href="index.html">← Control</a>
</div>

<div id="main-grid">

  <div class="panel" id="cam-panel">
    <div class="panel-header">
      <span class="panel-title">Camera View · 3D</span>
      <span class="panel-tag tag-cam">90° FOV</span>
      <div class="top-sep"></div>
      <span style="font-size:10px;color:var(--muted)" id="det-count">No detections</span>
    </div>
    <div id="three-wrap">
      <canvas id="three-canvas"></canvas>
      <canvas id="cam-hud"></canvas>
      <canvas id="compass-canvas" width="72" height="72"></canvas>
      <div id="hdg-bar">HDG: 000° N</div>
      <div id="corner-ind">CORNER PEEK</div>
      <div id="yolo-stamp">SAR-YOLO v1  SIMULATED</div>
    </div>
  </div>

  <div class="panel" id="lidar-panel">
    <div class="panel-header">
      <span class="panel-title">LiDAR Array</span>
      <span class="panel-tag tag-lidar">360° / 10° Step</span>
      <div class="top-sep"></div>
      <span style="font-size:10px;color:var(--muted)" id="lidar-min-lbl">-</span>
    </div>
    <canvas id="lidar-canvas"></canvas>
  </div>

  <div class="panel" id="tele-panel">
    <div class="tele-col">
      <div class="tele-title">Agent Telemetry</div>
      <div class="tele-row"><span class="tele-label">ID</span><span class="tele-val" id="t-id">-</span></div>
      <div class="tele-row"><span class="tele-label">Score</span><span class="tele-val green" id="t-score">-</span></div>
      <div class="tele-row"><span class="tele-label">Heading</span><span class="tele-val" id="t-hdg">-</span></div>
      <div class="tele-row"><span class="tele-label">Mode</span><span class="tele-val" id="t-mode">-</span></div>
      <div class="tele-row"><span class="tele-label">Active</span><span class="tele-val" id="t-active">-</span></div>
    </div>
    <div class="tele-col">
      <div class="tele-title">Camera Detections</div>
      <div id="det-list"></div>
    </div>
    <div class="tele-col">
      <div class="tele-title">Decision Log</div>
      <div id="dec-log"></div>
    </div>
    <div class="tele-col">
      <div class="tele-title">LiDAR Stats</div>
      <div class="tele-row"><span class="tele-label">Min</span><span class="tele-val yellow" id="t-lmin">-</span></div>
      <div class="tele-row"><span class="tele-label">Max</span><span class="tele-val green" id="t-lmax">-</span></div>
      <div class="tele-row"><span class="tele-label">Rays</span><span class="tele-val" id="t-lrays">36</span></div>
      <div class="tele-row"><span class="tele-label">Blocked</span><span class="tele-val red" id="t-lblk">0</span></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
const API       = 'http://127.0.0.1:8000';
const POLL_MS   = 200;
const FOV_DEG   = 90;
const LIDAR_MAX = 30;
const D2R       = Math.PI / 180;

// ── Coordinate mapping ───────────────────────────────────────────────────────
// Backend: x = East metres, y = North metres (centred)
// heading: math degrees  0=East, 90=North, 180=West, 270=South  (CCW positive)
//
// Three.js world: +X = East, +Y = up, +Z = South (−Z = North)
//   world.x = backend.x
//   world.z = -backend.y
//
// camera.rotation.y  (YXZ order):
//   heading=0°(East)  → look along +X → rotation.y = -π/2
//   heading=90°(North)→ look along -Z → rotation.y = 0
//   formula: rotation.y = (heading_math - 90) * D2R

// ── App state ─────────────────────────────────────────────────────────────────
let selAgent      = 0;
let agents        = [];
let enemies       = [];
let decHistory    = [];
let sceneReady    = false;
let lastOkMs      = 0;

// ── Three.js init ─────────────────────────────────────────────────────────────
const wrap  = document.getElementById('three-wrap');
const tCvs  = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: tCvs, antialias: true });
renderer.setClearColor(0x030609, 1);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x030609, 80, 220);

const cam3d  = new THREE.PerspectiveCamera(FOV_DEG, 1, 0.3, 300);
cam3d.rotation.order = 'YXZ';

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 150, 50);
scene.add(sun);

// Ground
const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshLambertMaterial({ color: 0x1a2633 })
);
gnd.rotation.x = -Math.PI / 2;
scene.add(gnd);

// Scene groups
const roadGrp  = new THREE.Group();
const bldgGrp  = new THREE.Group();
const agGrp    = new THREE.Group();
const enGrp    = new THREE.Group();
scene.add(roadGrp, bldgGrp, agGrp, enGrp);

// Agent / enemy mesh maps  id → Group
const agMeshes = {};
const enMeshes = {};

// ── HUD + Compass canvases ────────────────────────────────────────────────────
const hudCvs = document.getElementById('cam-hud');
const hudCtx = hudCvs.getContext('2d');
const cmpCvs = document.getElementById('compass-canvas');
const cmpCtx = cmpCvs.getContext('2d');

// ── Resize handler ─────────────────────────────────────────────────────────────
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  tCvs.style.width = w + 'px'; tCvs.style.height = h + 'px';
  cam3d.aspect = w / h; cam3d.updateProjectionMatrix();
  hudCvs.width = w; hudCvs.height = h;
  hudCvs.style.width = w + 'px'; hudCvs.style.height = h + 'px';
}
window.addEventListener('resize', resize);
setTimeout(resize, 100);

// ══════════════════════════════════════════════════════════════════════════════
// SCENE LOADING
// ══════════════════════════════════════════════════════════════════════════════
let currentMapHash = "";
async function checkScene() {
  try {
    const r = await fetch(API + '/api/sim/scene');
    if (!r.ok) return;
    const d = await r.json();
    const hash = d.cx + "_" + d.cy + "_" + (d.roads?.length || 0);
    if (currentMapHash !== hash) {
        currentMapHash = hash;
        buildRoads(d.roads || []);
        buildBuildings(d.buildings || []);
    }
    sceneReady = true;
  } catch (_) {}
}

function buildRoads(roads) {
  roadGrp.clear();
  if (!roads.length) return;

  const matMap = {
    motorway:    new THREE.MeshLambertMaterial({ color: 0x4a5568 }),
    trunk:       new THREE.MeshLambertMaterial({ color: 0x4a5568 }),
    primary:     new THREE.MeshLambertMaterial({ color: 0x374151 }),
    secondary:   new THREE.MeshLambertMaterial({ color: 0x374151 }),
    default:     new THREE.MeshLambertMaterial({ color: 0x2d3748 }),
  };
  const fallbackWidths = {
    "motorway": 5.0, "trunk": 4.5, "primary": 4.0, "secondary": 3.5,
    "tertiary": 3.0, "residential": 2.5, "unclassified": 2.5, "road": 2.5,
  };

  for (const r of roads) {
    const dx = r.x2 - r.x1;
    const dy = -r.y2 - (-r.y1);
    const len = Math.hypot(dx, dy);
    if (len < 0.1) continue;

    const angle = Math.atan2(dy, dx);
    const width = r.w || fallbackWidths[r.hw] || 2.5;
    const mat   = matMap[r.hw] || matMap.default;

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(len, width), mat);
    plane.position.set((r.x1 + r.x2) / 2, 0.06, (-r.y1 - r.y2) / 2);
    plane.rotation.x = -Math.PI / 2;
    plane.rotation.z = angle;
    roadGrp.add(plane);
  }
}

function buildBuildings(bldgs) {
  bldgGrp.clear();
  for (const b of bldgs) {
    if (!b.coords || b.coords.length < 3) continue;
    try {
      const shape = new THREE.Shape();
      // Shape is drawn in XY plane then rotated.
      shape.moveTo(b.coords[0].x, b.coords[0].y);
      for (let i = 1; i < b.coords.length; i++)
        shape.lineTo(b.coords[i].x, b.coords[i].y);
      shape.closePath();

      const h   = Math.max(3, b.h || 10);
      const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);   // extrude goes +Z → rotate up to +Y, Y goes to -Z

      const bright = 0.5 + Math.min(0.3, h / 100);
      const mesh   = new THREE.Mesh(geo,
        new THREE.MeshLambertMaterial({
          color:    new THREE.Color(bright, bright + 0.1, bright + 0.2),
          emissive: new THREE.Color(0.05, 0.08, 0.12),
        }));
      bldgGrp.add(mesh);

      // Wire edges for definition
      bldgGrp.add(new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x304050 })
      ));
    } catch (_) {}
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// ENTITY MESHES
// ══════════════════════════════════════════════════════════════════════════════
function makeAgent(hexColor) {
  const g = new THREE.Group();
  
  const shape = new THREE.Shape();
  shape.moveTo(0.8, 0); 
  shape.lineTo(-0.6, 0.5); 
  shape.lineTo(-0.4, 0); 
  shape.lineTo(-0.6, -0.5); 
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 2 });
  geo.center();
  geo.rotateX(Math.PI / 2);

  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: hexColor, emissive: hexColor, emissiveIntensity: 0.4 }));
  mesh.position.y = 0.4;
  g.add(mesh);
  return g;
}

function makeEnemy(type) {
  const g      = new THREE.Group();
  const aggr   = type === 'aggressive';
  const col    = aggr ? 0xef4444 : 0xa855f7;
  const shape = new THREE.Shape();
  shape.moveTo(0.7, 0); shape.lineTo(-0.5, 0.4); shape.lineTo(-0.5, -0.4); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.4, bevelEnabled: false });
  geo.center();
  geo.rotateX(Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 }));
  mesh.position.y = 0.4;
  g.add(mesh);
  return g;
}

function syncAgentMesh(ag) {
  if (!agMeshes[ag.id]) {
    const m = makeAgent(new THREE.Color(ag.color || '#3d78ff'));
    agGrp.add(m); agMeshes[ag.id] = m;
  }
  const m = agMeshes[ag.id];
  m.position.set(ag.x ?? 0, 0.55, -(ag.y ?? 0));
  // Three.js Y-rotation for heading: looking along +X when heading=0°(East)
  // rotation.y = -(heading_math) * D2R  (negative because Three.js is right-hand)
  m.rotation.y = (ag.heading ?? 0) * D2R;
  m.visible    = (ag.id !== selAgent) && (ag.active !== false);
}

function syncEnemyMesh(en) {
  if (!enMeshes[en.id]) {
    const m = makeEnemy(en.type || 'patrol');
    enGrp.add(m); enMeshes[en.id] = m;
  }
  const m = enMeshes[en.id];
  m.position.set(en.x ?? 0, 0.6, -(en.y ?? 0));
  m.rotation.y = (en.heading ?? 0) * D2R;
}

// ══════════════════════════════════════════════════════════════════════════════
// CAMERA
// ══════════════════════════════════════════════════════════════════════════════
function applyCamera(ag) {
  const x = ag.x ?? 0, y = ag.y ?? 0, h = ag.heading ?? 0;
  const backDist = 6.0;
  const height = 2.5;
  
  const fx = Math.cos(h * D2R);
  const fy = Math.sin(h * D2R);
  
  cam3d.position.set(x - fx * backDist, height, -(y - fy * backDist));
  cam3d.lookAt(x + fx * 15.0, 1.0, -(y + fy * 15.0));
  
  updateHdg(h);
}

// ══════════════════════════════════════════════════════════════════════════════
// HUD: 2D YOLO-STYLE BOXES (projected from world positions)
// ══════════════════════════════════════════════════════════════════════════════
const _v3 = new THREE.Vector3();
function drawHud(dets, agX, agY, hMath) {
  const W = hudCvs.width, H = hudCvs.height;
  hudCtx.clearRect(0, 0, W, H);
  if (!dets.length) return;

  for (const d of dets) {
    // Reconstruct world position:
    // angle_deg: +right in camera view
    // camera right = perpendicular CW from heading in math = heading - 90°
    // entity direction from agent = heading - d.angle_deg  (because +right = CW in math)
    const dirMath = (hMath - d.angle_deg) * D2R;
    const wx = agX + Math.cos(dirMath) * d.dist_m;
    const wy = agY + Math.sin(dirMath) * d.dist_m;

    _v3.set(wx, 1.0, -wy);
    _v3.project(cam3d);

    if (_v3.z > 1) continue;   // behind camera
    const sx = ( _v3.x + 1) * W / 2;
    const sy = (-_v3.y + 1) * H / 2;
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;

    let col = '#f59e0b';
    if (d.type === 'aggressive') col = '#ef4444';
    else if (d.type === 'target') col = '#ffd700';

    const bw   = Math.max(20, Math.min(110, 1200 / (d.dist_m + 1)));
    const bh   = bw * 1.5;
    const bx = sx - bw / 2, by = sy - bh / 2;

    hudCtx.strokeStyle = col; hudCtx.lineWidth = 1.5;
    hudCtx.strokeRect(bx, by, bw, bh);

    // Corner brackets
    const bs = 6; hudCtx.lineWidth = 2.5;
    for (const [px, py, sx2, sy2] of [[bx, by, 1, 1],[bx+bw, by, -1, 1],[bx, by+bh, 1, -1],[bx+bw, by+bh, -1, -1]]) {
      hudCtx.beginPath();
      hudCtx.moveTo(px, py + sy2*bs); hudCtx.lineTo(px, py); hudCtx.lineTo(px + sx2*bs, py);
      hudCtx.stroke();
    }

    hudCtx.fillStyle = col; hudCtx.font = 'bold 10px Share Tech Mono'; hudCtx.textAlign = 'left';
    hudCtx.fillText(`${d.type.slice(0,4).toUpperCase()}  ${d.dist_m}m | ${d.angle_deg >= 0 ? '+':''}${d.angle_deg}°`, bx, by - 4);

    const conf = Math.max(0, 1 - d.dist_m / 50);
    hudCtx.fillStyle = col + '44'; hudCtx.fillRect(bx, by+bh+2, bw*conf, 3);
    hudCtx.strokeStyle = col; hudCtx.lineWidth = 0.5; hudCtx.strokeRect(bx, by+bh+2, bw, 3);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// HEADING BAR + COMPASS ROSE
// ══════════════════════════════════════════════════════════════════════════════
const CARD8 = ['N','NE','E','SE','S','SW','W','NW'];
function compassDir(hC) { return CARD8[Math.round(((hC % 360) + 360) % 360 / 45) % 8]; }

function updateHdg(hMath) {
  const hC = ((90 - hMath) % 360 + 360) % 360;
  document.getElementById('hdg-bar').textContent =
    `HDG: ${String(Math.round(hC)).padStart(3,'0')}°  ${compassDir(hC)}`;
  drawCompass(hC);
}

function drawCompass(hC) {
  const W=72, H=72, cx=36, cy=36, r=28;
  cmpCtx.clearRect(0,0,W,H);
  // Circle bg
  cmpCtx.beginPath(); cmpCtx.arc(cx,cy,r,0,Math.PI*2);
  cmpCtx.fillStyle='rgba(0,0,0,.6)'; cmpCtx.fill();
  cmpCtx.strokeStyle='rgba(0,212,255,.3)'; cmpCtx.lineWidth=1; cmpCtx.stroke();

  // Cardinal labels (world-fixed, screen angle adjusted by heading)
  const cardinals = [['N',0,'#ef4444'],['E',90,'#00d4ff'],['S',180,'#777'],['W',270,'#777']];
  for (const [lbl, worldC, col] of cardinals) {
    const delta  = worldC - hC;                   // relative to camera forward
    const scAngl = (-delta - 90) * D2R;           // canvas: up=forward, CW=positive
    const tx = cx + Math.cos(scAngl) * (r - 7);
    const ty = cy + Math.sin(scAngl) * (r - 7);
    cmpCtx.fillStyle = col; cmpCtx.font = 'bold 9px Share Tech Mono';
    cmpCtx.textAlign = 'center'; cmpCtx.textBaseline = 'middle';
    cmpCtx.fillText(lbl, tx, ty);
  }

  // Pointer (always up = forward)
  cmpCtx.strokeStyle = '#00d4ff'; cmpCtx.lineWidth = 2;
  cmpCtx.beginPath(); cmpCtx.moveTo(cx, cy+10); cmpCtx.lineTo(cx, cy-16); cmpCtx.stroke();
  cmpCtx.fillStyle = '#00d4ff';
  cmpCtx.beginPath(); cmpCtx.moveTo(cx,cy-20); cmpCtx.lineTo(cx-4,cy-12); cmpCtx.lineTo(cx+4,cy-12); cmpCtx.closePath(); cmpCtx.fill();
  cmpCtx.fillStyle='#fff'; cmpCtx.beginPath(); cmpCtx.arc(cx,cy,2.5,0,Math.PI*2); cmpCtx.fill();
}

// ══════════════════════════════════════════════════════════════════════════════
// LIDAR
// ══════════════════════════════════════════════════════════════════════════════
const ldrCvs = document.getElementById('lidar-canvas');
const ldrCtx = ldrCvs.getContext('2d');

function drawLidar(ranges, hMath, dets) {
  const lp  = document.getElementById('lidar-panel');
  const W   = lp.clientWidth, H = Math.max(1, lp.clientHeight - 37);
  if (ldrCvs.width!==W || ldrCvs.height!==H){ ldrCvs.width=W; ldrCvs.height=H; }
  ldrCtx.clearRect(0,0,W,H);
  if (!ranges.length) return;

  const cx=W/2, cy=H/2, maxR=Math.min(W,H)/2-22;

  // Radial glow
  const grad = ldrCtx.createRadialGradient(cx,cy,0,cx,cy,maxR);
  grad.addColorStop(0,'rgba(0,212,255,.04)'); grad.addColorStop(1,'rgba(0,212,255,0)');
  ldrCtx.fillStyle=grad; ldrCtx.beginPath(); ldrCtx.arc(cx,cy,maxR,0,Math.PI*2); ldrCtx.fill();

  // Rings
  for (const rng of [10,20,30]) {
    const pr=(rng/LIDAR_MAX)*maxR;
    ldrCtx.beginPath(); ldrCtx.arc(cx,cy,pr,0,Math.PI*2);
    ldrCtx.strokeStyle='rgba(0,212,255,.1)'; ldrCtx.lineWidth=1; ldrCtx.stroke();
    ldrCtx.fillStyle='rgba(0,212,255,.25)'; ldrCtx.font='8px Share Tech Mono';
    ldrCtx.textAlign='center'; ldrCtx.textBaseline='alphabetic';
    ldrCtx.fillText(`${rng}m`, cx, cy-pr+10);
  }

  // Grid spokes
  ldrCtx.strokeStyle='rgba(0,212,255,.06)'; ldrCtx.lineWidth=1;
  for (let a=0;a<360;a+=45){
    ldrCtx.beginPath(); ldrCtx.moveTo(cx,cy);
    ldrCtx.lineTo(cx+Math.cos(a*D2R)*maxR, cy+Math.sin(a*D2R)*maxR); ldrCtx.stroke();
  }

  // Cardinal direction labels (world-fixed, drawn relative to camera heading)
  // Display convention: agent forward = up (−Y on canvas)
  // Canvas angle for a world-math angle: scAngl = -(worldMath - hMath)*D2R - π/2
  const cardLabels = [['N',90,'#e55'],['E',0,'#0df'],['S',-90,'#777'],['W',180,'#777']];
  for (const [lbl, wMath, col] of cardLabels) {
    const delta  = wMath - hMath;
    const scAngl = -delta * D2R - Math.PI / 2;
    const tx = cx + Math.cos(scAngl)*(maxR-11);
    const ty = cy + Math.sin(scAngl)*(maxR-11);
    ldrCtx.fillStyle=col; ldrCtx.font='bold 9px Share Tech Mono';
    ldrCtx.textAlign='center'; ldrCtx.textBaseline='middle';
    ldrCtx.fillText(lbl, tx, ty);
  }

  // ── Swept polygon ──
  // Ray i: world math angle = hMath + i*10°  (CCW from East)
  // Screen: forward=up. Delta from heading = i*10. Canvas (Y-down) = clockwise = -i*10.
  // scAngl(i) = -i*10*D2R - π/2
  ldrCtx.beginPath();
  for (let i=0;i<ranges.length;i++){
    const sc = -i*10*D2R - Math.PI/2;
    const pr = (Math.min(ranges[i],LIDAR_MAX)/LIDAR_MAX)*maxR;
    const px = cx+Math.cos(sc)*pr, py = cy+Math.sin(sc)*pr;
    if (i===0) ldrCtx.moveTo(px,py); else ldrCtx.lineTo(px,py);
  }
  ldrCtx.closePath();
  ldrCtx.fillStyle='rgba(34,197,94,.08)'; ldrCtx.fill();
  ldrCtx.strokeStyle='#22c55e'; ldrCtx.lineWidth=1.2; ldrCtx.stroke();

  // Hit points
  for (let i=0;i<ranges.length;i++){
    if (ranges[i]>=LIDAR_MAX-0.1) continue;
    const sc = -i*10*D2R - Math.PI/2;
    const pr=(ranges[i]/LIDAR_MAX)*maxR;
    ldrCtx.fillStyle='#22c55eCC';
    ldrCtx.beginPath(); ldrCtx.arc(cx+Math.cos(sc)*pr, cy+Math.sin(sc)*pr, 2.5, 0, Math.PI*2); ldrCtx.fill();
  }

  // Camera FOV cone (forward ± 45°)
  const fovH  = (FOV_DEG/2)*D2R;
  const fovDist = (80/LIDAR_MAX)*maxR;
  ldrCtx.beginPath(); ldrCtx.moveTo(cx,cy);
  ldrCtx.arc(cx,cy,fovDist, -Math.PI/2+fovH, -Math.PI/2-fovH, true);
  ldrCtx.closePath();
  ldrCtx.fillStyle='rgba(0,212,255,.07)'; ldrCtx.fill();
  ldrCtx.strokeStyle='rgba(0,212,255,.4)'; ldrCtx.lineWidth=1; ldrCtx.stroke();

  // Detection dots
  for (const d of (dets||[])) {
    // +right convention: world dir = hMath - d.angle_deg
    const delta  = -d.angle_deg;
    const sc     = -delta*D2R - Math.PI/2;
    const pr     = (Math.min(d.dist_m,LIDAR_MAX)/LIDAR_MAX)*maxR;
    const col    = d.type==='aggressive'?'#ef4444':'#f59e0b';
    ldrCtx.fillStyle=col;
    ldrCtx.beginPath(); ldrCtx.arc(cx+Math.cos(sc)*pr, cy+Math.sin(sc)*pr, 5, 0, Math.PI*2); ldrCtx.fill();
    ldrCtx.strokeStyle=col+'55'; ldrCtx.lineWidth=1;
    ldrCtx.beginPath(); ldrCtx.arc(cx+Math.cos(sc)*pr, cy+Math.sin(sc)*pr, 10, 0, Math.PI*2); ldrCtx.stroke();
  }

  // Forward arrow
  ldrCtx.strokeStyle='#00d4ff'; ldrCtx.lineWidth=2;
  ldrCtx.beginPath(); ldrCtx.moveTo(cx,cy); ldrCtx.lineTo(cx,cy-22); ldrCtx.stroke();
  ldrCtx.fillStyle='#00d4ff';
  ldrCtx.beginPath(); ldrCtx.moveTo(cx,cy-26); ldrCtx.lineTo(cx-4,cy-18); ldrCtx.lineTo(cx+4,cy-18); ldrCtx.closePath(); ldrCtx.fill();

  ldrCtx.fillStyle='#00d4ff'; ldrCtx.beginPath(); ldrCtx.arc(cx,cy,4,0,Math.PI*2); ldrCtx.fill();
  ldrCtx.fillStyle='rgba(0,212,255,.28)'; ldrCtx.font='8px Share Tech Mono'; ldrCtx.textAlign='left';
  ldrCtx.textBaseline='alphabetic'; ldrCtx.fillText(`MAX ${LIDAR_MAX}m`,8,H-8);
}

// ══════════════════════════════════════════════════════════════════════════════
// TELEMETRY
// ══════════════════════════════════════════════════════════════════════════════
function updateTele(ag) {
  if (!ag) return;
  document.getElementById('t-id').textContent = `Agent ${ag.id}`;
  document.getElementById('t-score').textContent = ag.score ?? 0;
  const hC = ag.heading_compass ?? ((90-(ag.heading??0))%360+360)%360;
  document.getElementById('t-hdg').textContent = `${String(Math.round(hC)).padStart(3,'0')}°  ${compassDir(hC)}`;

  const mE=document.getElementById('t-mode');
  const dec=ag.last_decision||'';
  if (ag.escape_mode)                 { mE.textContent='ESCAPE';      mE.className='tele-val red'; }
  else if (dec.includes('CORNER'))    { mE.textContent='CORNER PEEK'; mE.className='tele-val yellow'; }
  else if (dec.includes('BLOCKED'))   { mE.textContent='BLOCKED';     mE.className='tele-val yellow'; }
  else                                { mE.textContent='NAVIGATE';    mE.className='tele-val green'; }

  const aE=document.getElementById('t-active');
  aE.textContent = ag.active ? 'ONLINE' : 'INCAPACITATED';
  aE.className   = `tele-val ${ag.active ? 'green':'red'}`;

  document.getElementById('topbar-score').textContent = `SCORE: ${ag.score??0}`;
  document.getElementById('topbar-dec').textContent   = dec || '-';
  document.getElementById('corner-ind').style.display = dec.includes('CORNER') ? 'block':'none';

  const cams=ag.camera||[];
  document.getElementById('det-count').textContent =
    cams.length ? `${cams.length} detection${cams.length>1?'s':''}` : 'No detections';
  const dl=document.getElementById('det-list');
  dl.innerHTML = cams.length
    ? cams.map(d=>`<div class="d-entry ${d.type==='aggressive'?'aggr':(d.type==='target'?'tgt':'patr')}">
        <span>${d.type.toUpperCase()}</span>
        <span class="d-badge">${d.dist_m}m | ${d.angle_deg>=0?'+':''}${d.angle_deg}°</span>
      </div>`).join('')
    : '<div class="d-entry none">No entities in FOV</div>';

  const d2 = dec||'IDLE';
  if (!decHistory.length || decHistory[decHistory.length-1]!==d2) {
    decHistory.push(d2); if (decHistory.length>6) decHistory.shift();
  }
  document.getElementById('dec-log').innerHTML =
    decHistory.slice().reverse().map((d,i)=>{
      let c = i===0?'da':'';
      if (d.includes('ESCAPE')) c='de';
      else if (d.includes('CORNER')||d.includes('BLOCKED')) c='dc';
      else if (d.includes('Target')||d.includes('MANEUVER')) c='dg';
      return `<div class="${c}">${i===0?'> ':'  '}${d}</div>`;
    }).join('');

  const lr=ag.lidar||[];
  if (lr.length) {
    const mn=Math.min(...lr).toFixed(1), mx=Math.max(...lr).toFixed(1);
    const blk=lr.filter(r=>r<5).length;
    document.getElementById('t-lmin').textContent=`${mn}m`;
    document.getElementById('t-lmax').textContent=`${mx}m`;
    document.getElementById('t-lblk').textContent=blk;
    document.getElementById('t-lrays').textContent=lr.length;
    document.getElementById('lidar-min-lbl').textContent=`Min: ${mn}m`;
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// AGENT SELECTOR
// ══════════════════════════════════════════════════════════════════════════════
function selectAgent(id) {
  selAgent = parseInt(id);
  for (const [mid, mesh] of Object.entries(agMeshes)) {
    const ag = agents.find(a=>a.id===parseInt(mid));
    mesh.visible = (parseInt(mid)!==selAgent) && (ag?.active!==false);
  }
}

function syncSelector(ags) {
  const sel = document.getElementById('agent-select');
  const ids  = new Set(ags.map(a=>a.id));
  for (const ag of ags) {
    if (![...sel.options].some(o=>parseInt(o.value)===ag.id)) {
      const o=document.createElement('option');
      o.value=ag.id; o.text=`Agent ${ag.id}${ag.active===false?' [KIA]':''}`;
      if (ag.id===selAgent) o.selected=true;
      sel.add(o);
    }
  }
  for (let i=sel.options.length-1;i>=0;i--)
    if (!ids.has(parseInt(sel.options[i].value))) sel.remove(i);
}

// ══════════════════════════════════════════════════════════════════════════════
// POLL + STATUS
// ══════════════════════════════════════════════════════════════════════════════
function setLive(y) {
  const el = document.getElementById('connection-status');
  el.textContent = y ? 'LIVE' : 'OFFLINE';
  el.className   = y ? 'live' : 'offline';
}

async function poll() {
  await checkScene();
  try {
    const res  = await fetch(API + '/api/robot/position');
    if (!res.ok) throw 0;
    const data = await res.json();
    lastOkMs   = Date.now();
    // Show LIVE only when agents are actively moving (sim has started)
    const hasActiveAgent = (data.agents || []).some(a => a.active !== false && a.lat);
    setLive(hasActiveAgent);

    agents  = data.agents  || [];
    enemies = data.enemies || [];
    syncSelector(agents);

    for (const ag of agents)  syncAgentMesh(ag);
    for (const en of enemies) syncEnemyMesh(en);

    const ag = agents.find(a=>a.id===selAgent) || agents[0];
    if (ag) {
      applyCamera(ag);
      cam3d.updateMatrixWorld(true);
      drawLidar(ag.lidar||[], ag.heading??0, ag.camera||[]);
      drawHud(ag.camera||[], ag.x??0, ag.y??0, ag.heading??0);
      updateTele(ag);
    }
  } catch (_) {
    if (Date.now()-lastOkMs>3000) setLive(false);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════════════════════════════════════
(function loop() { requestAnimationFrame(loop); renderer.render(scene, cam3d); })();
setInterval(poll, POLL_MS);
poll();
</script>
